name: export-source

# Snapshot trigger: 2026-09-02 variant workspace integration.
on:
  push:
    paths:
      - .github/workflows/export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack source tree
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/melo-game-creative-studio-source.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: melo-game-creative-studio-source
          path: /tmp/melo-game-creative-studio-source.tar.gz
          if-no-files-found: error
          retention-days: 1
